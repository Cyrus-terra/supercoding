name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
          - os: ubuntu-22.04
            python: '3.9'
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate repository and standalone runtime
        run: |
          python -B scripts/validate_skill.py
          python -B scripts/validate_skill.py skills/supercoding
      - name: Deterministic regression tests
        shell: python {0}
        run: |
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover('tests', pattern='test_*.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          for test, traceback in result.failures + result.errors:
              message = f'{test.id()}\n{traceback}'
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error::{message}', flush=True)
          sys.exit(0 if result.wasSuccessful() else 1)
      - name: Original baselines and correct controls (no model calls)
        run: python -B scripts/run_examples.py
      - name: Whitespace checks
        run: git diff --check
